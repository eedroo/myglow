# Cópia de segurança diária da base de produção (Neon), encriptada antes de sair do contentor (F12).
# Segredos: BACKUP_DATABASE_URL (ligação directa, sem -pooler) e BACKUP_PASSPHRASE. Ver docs/RUNBOOK.md.
name: backup

on:
  schedule:
    - cron: '17 3 * * *' # todos os dias às 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Versão do Postgres do Neon (confirmar no painel): o pg_dump tem de ser da mesma versão ou superior.
      PG_IMAGE: postgres:17-alpine
    steps:
      - name: Dump encriptado (pg_dump → gpg, nunca em claro no disco)
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_DATABASE_URL}" ] || [ -z "${BACKUP_PASSPHRASE}" ]; then
            echo "::error::Faltam os segredos BACKUP_DATABASE_URL e/ou BACKUP_PASSPHRASE."
            exit 1
          fi
          FILE="myglow-$(date -u +%F).dump.gpg"
          docker run --rm -e BACKUP_DATABASE_URL -e BACKUP_PASSPHRASE "$PG_IMAGE" sh -c '
            apk add --no-cache --quiet bash gnupg >/dev/null && exec bash -c "
              set -euo pipefail
              umask 077
              printf %s \"\$BACKUP_PASSPHRASE\" > /tmp/pass
              pg_dump --format=custom --no-owner --no-privileges \"\$BACKUP_DATABASE_URL\" \
                | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 --passphrase-file /tmp/pass
              rm -f /tmp/pass
            "' > "$FILE"
          test -s "$FILE"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          echo "Cópia: \`$FILE\` ($(du -h "$FILE" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar como artefacto (30 dias)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 30
          if-no-files-found: error
